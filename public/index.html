<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School ERP System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- CSS Files (Order matters) -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dark-theme.css">
  
  <style>
    #loginScreen, #appLayout { display: none; }
    #loginScreen.active { display: block !important; }
    #appLayout.active { display: flex !important; }
    
    body {
      visibility: hidden;
    }
    body.loaded {
      visibility: visible;
    }
  </style>
  
  <!-- Load Theme & Language Managers Early -->
  <script src="/js/themeManager.js"></script>
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  
  <!-- ✅ NEW: Apply saved theme immediately -->
  <script>
    // Apply saved theme color on page load
    (function() {
      const savedColor = localStorage.getItem('themeColor');
      if (savedColor) {
        document.documentElement.style.setProperty('--theme-primary', savedColor);
        
        // Calculate darker and lighter variants
        function adjustColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = (num >> 16) + amt;
          const G = (num >> 8 & 0x00FF) + amt;
          const B = (num & 0x0000FF) + amt;
          return '#' + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
            (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
            (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
        }
        
        document.documentElement.style.setProperty('--theme-primary-dark', adjustColor(savedColor, -20));
        document.documentElement.style.setProperty('--theme-primary-light', adjustColor(savedColor, 40));
        
        // Convert to RGB
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(savedColor);
        if (result) {
          const rgb = `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}`;
          document.documentElement.style.setProperty('--theme-primary-rgb', rgb);
        }
      }
    })();
  </script>
</head>
<body class="bg-light" onload="document.body.classList.add('loaded')">

  <!-- Login Screen -->
  <div id="loginScreen" class="container mt-5" style="max-width: 400px;">
    <div class="card shadow">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0" data-i18n="auth.loginTitle">School ERP Login</h3>
          <div class="d-flex gap-2">
            <button class="lang-toggle-btn" onclick="toggleLanguage()" title="Toggle Language">
              <i class="bi bi-translate"></i>
              <span class="lang-text">اردو</span>
            </button>
            <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">
              <i class="bi bi-moon-fill"></i>
            </button>
          </div>
        </div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label" data-i18n="auth.username">Username</label>
            <input type="text" id="loginUsername" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="auth.password">Password</label>
            <input type="password" id="loginPassword" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" data-i18n="auth.login">Login</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Main App Layout -->
  <div id="appLayout" class="d-flex">
    <nav id="sidebar" class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;"></nav>
    <main class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between mb-4">
        <h2 id="pageTitle" data-i18n="dashboard.title">Dashboard</h2>
        <div class="d-flex gap-2">
          <button class="lang-toggle-btn" onclick="toggleLanguage()" title="Toggle Language">
            <i class="bi bi-translate"></i>
            <span class="lang-text">اردو</span>
          </button>
          <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">
            <i class="bi bi-moon-fill"></i>
          </button>
          <button class="btn btn-outline-danger btn-sm" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i> <span data-i18n="app.logout">Logout</span>
          </button>
        </div>
      </div>
      <div id="mainContent"></div>
    </main>
  </div>

  <!-- Global Containers -->
  <div id="toastContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 1055;"></div>
  <div id="modalContainer"></div>
  <div id="printArea" class="d-none"></div>

  <!-- Core Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
  
  <!-- Module Scripts -->
  <script src="/js/users.js"></script>
  <script src="/js/academic.js"></script>
  <script src="/js/finance.js"></script>
  <script src="/js/salary.js"></script>
  <script src="/js/examination.js"></script>
  <script src="/js/attendance.js"></script>
  
  <!-- Report Scripts -->
  <script src="/js/classResultReport.js"></script>
  
  <!-- Utility Scripts -->
  <script src="/js/backupRestore.js"></script>
  <script src="/js/archive.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/audit.js"></script>
  <script src="/js/dataManager.js"></script>
  <script src="/js/financialReports.js"></script>
  <script src="/js/feeReminders.js"></script>
  <script src="/js/idCards.js"></script>
  <script src="/js/databaseTools.js"></script>
</body>
</html>
